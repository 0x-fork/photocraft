[[item]]
id = "TYPE-218-2"
target = "Paragraph direction (Auto/LTR/RTL) in the panel and options bar; visual RTL caret"
status = "missing"
issue = 218
note = "Engine has TextDirection (text.rs:155); no UI"

[[item]]
id = "TYPE-218-3"
target = "Thai/Khmer/Indic fallback fonts; golden shaping tests for complex scripts and RTL"
status = "partial"
issue = 218
note = "Thai is covered: THAI_FAMILIES (fonts.rs) lists the Windows, macOS and Linux families and thai_in_latin_font_falls_back_to_installed_thai_font checks a sample with above and below marks (#1909); Arabic and Hebrew fall back too. Khmer and Indic have no fallback list, and there are no per-script golden shaping tests (only a bidi test)"

[[item]]
id = "TYPE-218-4"
target = "Variable font axis sliders from the font's axes; opsz follows the point size"
status = "done"
issue = 218
note = "One slider per axis of the style's font in the Character section (Properties and Window > Character), setting type.setStyle variations; opsz follows the type size unless set (layout.rs variation_list); a style or weight resets the wght axis (#2985). PSD does not round-trip axis values yet"

[[item]]
id = "TYPE-218-5"
target = "OpenType UI: Character panel buttons, Numerals and Stylistic Sets submenus"
status = "partial"
issue = 218
note = "Type > OpenType toggles (type_extra_cmds.rs:512); no panel buttons or submenus"

[[item]]
id = "TYPE-218-6"
target = "Manual pair kerning (Alt+arrows), optical kerning rendered, both round-trip PSD (#206)"
status = "done"
issue = 218
note = "Alt+Left/Right at a collapsed caret kerns the pair (type_tool.rs kern_pair, 20 per step and 100 with Cmd; type_tool_alt_arrows_kern_the_pair). Optical kerning is computed from the glyph outlines in text/src/optical.rs and applied by layout.rs when the run's mode is Optical (optical_matches_photoshop, optical_kerning_tightens_open_pairs). Both modes and manual values round-trip through PSD (io/tests/psd_kerning.rs; the optical mode travels in Txt2, txt2_carries_optical_kerning)"

[[item]]
id = "TYPE-218-7"
target = "Warp Text dialog previews live and opens with the layer's current warp"
status = "missing"
issue = 218
note = "view_cmds.rs:834 always seeds arc, bend 50"

[[item]]
id = "TYPE-218-8"
target = "Text editing: select all, double/triple/quadruple-click selection, paste, with tests"
status = "partial"
issue = 218
note = "Cmd+A, paste and double-click exist; no triple/quadruple click, no tests"

[[item]]
id = "TYPE-218-9"
target = "Distort/Perspective/Warp on live type as in Photoshop (was: offer 'Rasterize and continue?'; Photoshop doesn't prompt)"
status = "done"
issue = 218
note = "Photoshop 2026 prompts for none of these: Edit › Transform › Warp on live type stays enabled with no rasterize prompt and offers only the warp styles (the mesh can't be dragged), so the type stays editable; Distort, Perspective and the split warps are greyed. PhotoCraft does the same: Warp on type commits the layer's Warp Text in one step (transform_tool.rs enter_type_warp, warp_cmds.rs warp_type_layer, #3004; warp_on_type_takes_a_style_and_keeps_the_type_editable), Distort/Perspective greyed (enable_rules.rs, #2701)"
